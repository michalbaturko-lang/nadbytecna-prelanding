<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadbytečná – Jsi zvědavá, co se chystá?</title>
<meta name="description" content="Něco se chystá. Nech nám e-mail a dáme ti vědět jako první.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbd9e6">
<style>
:root{--mg:#c20a58;--mg-d:#8a0640;--gold:#b98a2e;--ink:#4a1030}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100svh;display:grid;place-items:center;padding:clamp(20px,5vw,56px) 16px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--ink);
background:radial-gradient(120% 80% at 15% 0%,#fff1f6 0,transparent 55%),radial-gradient(90% 70% at 100% 100%,#f4b3cd 0,transparent 60%),linear-gradient(160deg,#fbd9e6,#f7c3d8 55%,#f2a9c5)}
main{width:100%;max-width:560px;text-align:center}
.logo{display:block;width:min(86%,440px);height:auto;margin:0 auto}
.rule{height:2px;width:120px;margin:clamp(22px,5vw,36px) auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1.15;color:var(--mg-d);letter-spacing:-.01em;text-wrap:balance}
.lead{margin:16px auto 28px;max-width:30em;font-size:clamp(16px,4vw,18px);line-height:1.5}
form{display:grid;gap:14px;text-align:left}
label.f{display:block;font:600 13px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mg-d);margin-bottom:8px}
input[type=email]{width:100%;font:400 18px/1.2 system-ui,sans-serif;padding:16px 18px;border:1.5px solid #d98aae;border-radius:12px;background:#fffafc;color:var(--ink)}
input[type=email]:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--mg);outline-offset:2px}
.consent{display:flex;gap:12px;align-items:flex-start;font:400 14px/1.45 system-ui,sans-serif}
.consent input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--mg)}
button{font:600 18px/1 system-ui,sans-serif;padding:18px 22px;border:0;border-radius:12px;background:var(--mg);color:#fff;cursor:pointer;transition:background .15s}
button:hover{background:var(--mg-d)}
.ok{display:none;margin-top:6px;font:500 16px/1.4 system-ui,sans-serif;color:var(--mg-d);text-align:center}
.tag{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font:500 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7a3a58;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:99px}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="VERY VERA – Nadbytečná" width="440" height="255">
  <div class="rule" aria-hidden="true"></div>
  <h1>Jsi zvědavá, co se chystá?</h1>
  <p class="lead">Připravujeme místo pro ženy, které si prošly něčím podobným. Nech nám e-mail a dáme ti vědět jako první.</p>
  <form id="f" novalidate>
    <div><label class="f" for="e">Tvůj e-mail</label><input id="e" type="email" autocomplete="email" inputmode="email" placeholder="jmeno@email.cz" required></div>
    <label class="consent"><input type="checkbox" id="c" required><span>Souhlasím, že [název s.r.o., IČO] bude zpracovávat moji e-mailovou adresu za účelem informování o spuštění platformy Nadbytečná. Souhlas mohu kdykoli odvolat.</span></label>
    <button type="submit">Chci vědět víc</button>
    <p class="ok" id="ok" role="status">Náhled: formulář nic neodesílá ani neukládá.</p>
  </form>
</main>
<div class="tag">Náhled designu</div>
<script>
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();document.getElementById('ok').style.display='block'});
</script>
</body>
</html>
